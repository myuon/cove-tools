# The webhook lab (issue #2): receive URLs that keep every request sent to
# them, and admin pages to read them. Everything is stored in the app's own
# key-value store, so it survives a restart.
grant = ["kv", "log", "time", "random", "auth", "fetch", "timer"]

[limits]
deadline = "10s"
# A webhook body; an endpoint stores at most its own `maxBody` of it.
max_request_bytes = 1048576
max_response_bytes = 4194304

[kv]
# An event is its body (at most 1 MiB) and its headers, as JSON.
max_value_bytes = 4194304
max_keys = 1000000
max_bytes = 1073741824

# Where a stored request may be resent: this host's own receive URLs, as
# the walkthrough serves them (port 8080), as `deploy/` serves them (port
# 8790), and at the deployment's public origin, whose `/webhooks/in/` the
# Cloudflare Access setup leaves open (`deploy/cloudflare.md`). Add the
# services you resend to.
[fetch]
allow = [
  "http://127.0.0.1:8080",
  "http://localhost:8080",
  "http://127.0.0.1:8790",
  "http://localhost:8790",
  "https://covtools.ramda.io",
]
# Below the run's deadline, so that a slow target is a stored failure rather
# than a 504.
timeout = "8s"
max_response_bytes = 1048576

# The admin pages' secret: `Authorization: Bearer <secret>`, or the password
# of a browser's login prompt (any user name). Set it in the environment the
# host runs in; the app is refused at load without it.
[secrets]
admin = { env = "WEBHOOKS_ADMIN_TOKEN" }
