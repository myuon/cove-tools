# CPU-heavy on purpose, and pure: the primes up to `?n=` by trial division,
# milliseconds of work per request and never parked. It is what the time
# slice is for: a run that has held its worker for a slice while others wait
# yields at a safepoint and continues later, on any worker.
grant = []

[limits]
# The deadline is what bounds it: `n = 200000`, the cap, takes a fraction of
# a second, so ten seconds admits every size it accepts with room to spare
# on a busy machine.
deadline = "10s"
max_in_flight = 8
max_queued = 64
