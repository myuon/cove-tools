[package]
name = "cove-host"
description = "Hosts many small Cove web apps on one machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "cove-host"

[dependencies]
cove-diag.workspace = true
cove-ir.workspace = true
cove-runtime.workspace = true
cove-sema.workspace = true
cove-syntax.workspace = true

bytes = "1"
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-util = "0.7"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
jsonwebtoken = "9"

[dev-dependencies]
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
